<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogue | BookNest</title>
    <link rel="stylesheet" href="store.css">
  </head>
  <body>
    <main class="page">
      <a class="back" href="home.html">← Back to store</a>
      <h1>Book Catalogue</h1>

      <!-- Experiment 3: catalogue cards with cover, author, publisher, price, and cart action. -->
      <div class="book-grid">
        <article class="book">
          <img src="images/web-tech.svg" alt="Web Technologies cover">
          <h2>Web Technologies</h2>
          <p>Uttam K. Roy · Oxford University Press</p>
          <strong>₹531</strong>
          <a class="button" href="cart.html?book=web">Add to cart</a>
        </article>

        <article class="book">
          <img src="images/php.svg" alt="PHP and MySQL cover">
          <h2>PHP &amp; MySQL Web Development</h2>
          <p>Luke Welling &amp; Laura Thompson · Pearson</p>
          <strong>₹898</strong>
          <a class="button" href="cart.html?book=php">Add to cart</a>
        </article>

        <article class="book">
          <img src="images/js.svg" alt="JavaScript cover">
          <h2>Modern JavaScript</h2>
          <p>David Flanagan · O'Reilly Media</p>
          <strong>₹650</strong>
          <a class="button" href="cart.html?book=js">Add to cart</a>
        </article>
      </div>
    </main>
  </body>
</html>
