<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Online Book Store</title>
  </head>

  <!-- Experiment 1: three-frame online bookstore layout. -->
  <frameset rows="30%, 70%">
    <!-- Header frame: logo and main navigation. -->
    <frame src="top.html" name="topframe" title="Store header">

    <!-- Content area: department links on the left and pages on the right. -->
    <frameset cols="18%, 82%">
      <frame src="left.html" name="leftframe" title="Store navigation">
      <frame src="right.html" name="rightframe" title="Store content">
    </frameset>
  </frameset>
</html>
