<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | BookNest</title>
    <link rel="stylesheet" href="store.css">
  </head>
  <body>
    <!-- Experiment 2: login form. -->
    <main class="form-card">
      <h1>Enter Login Details</h1>
      <form onsubmit="event.preventDefault(); alert('Login submitted');">
        <label>Login ID <input type="text" required></label>
        <label>Password <input type="password" required></label>
        <div>
          <button class="button" type="submit">Submit</button>
          <button class="button secondary" type="reset">Reset</button>
        </div>
      </form>
    </main>
  </body>
</html>
